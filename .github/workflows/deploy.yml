name: CI and Deploy

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # npm 10.9.8 crashes in Arborist while resolving Vitest 4.1.x peers.
      - run: npm install --global npm@11.6.0

      - run: npm ci

      - name: Compute exact browser dependency SRI
        run: |
          curl -fsSL https://cdn.jsdelivr.net/npm/marked@18.0.12/lib/marked.umd.js -o /tmp/marked.umd.js
          curl -fsSL https://cdn.jsdelivr.net/npm/dompurify@3.4.15/dist/purify.min.js -o /tmp/purify.min.js
          echo "MARKED_SRI=sha384-$(openssl dgst -sha384 -binary /tmp/marked.umd.js | openssl base64 -A)"
          echo "DOMPURIFY_SRI=sha384-$(openssl dgst -sha384 -binary /tmp/purify.min.js | openssl base64 -A)"

      - run: npm test

      - run: npm run typecheck

      - name: Generate validation config
        run: sed "s/YOUR_D1_DATABASE_ID/00000000-0000-0000-0000-000000000001/" wrangler.example.toml > wrangler.toml

      - run: npm run dry-run

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm install --global npm@11.6.0

      - run: npm ci

      - name: Generate Wrangler config
        run: |
          if [ -z "$CLOUDFLARE_D1_DATABASE_ID" ]; then
            echo "::error::Missing GitHub secret CLOUDFLARE_D1_DATABASE_ID"
            exit 1
          fi
          sed "s/YOUR_D1_DATABASE_ID/${CLOUDFLARE_D1_DATABASE_ID}/" wrangler.example.toml > wrangler.toml
        env:
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}

      - run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
