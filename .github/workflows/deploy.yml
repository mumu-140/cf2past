name: CI and Deploy

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-new-timer:
    if: github.event_name == 'pull_request' && github.head_ref == 'codex/comprehensive-hardening'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Cancel pending edit before atomic New
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/pages.ts')
          text = path.read_text()
          old = """async function newSession(){
            const response=await fetch('/api/new/'+roomPath,{"""
          new = """async function newSession(){
            if(sendTimer!==null){clearTimeout(sendTimer);sendTimer=null;}
            const response=await fetch('/api/new/'+roomPath,{"""
          if new in text:
              raise SystemExit(0)
          if text.count(old) != 1:
              raise SystemExit('expected New function marker exactly once')
          path.write_text(text.replace(old, new, 1))
          PY
          if git diff --quiet -- src/pages.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages.ts
          git commit -m "fix: cancel pending edit before New"
          git push origin HEAD:${{ github.head_ref }}

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # npm 10.9.8 crashes in Arborist while resolving Vitest 4.1.x peers.
      - run: npm install --global npm@11.6.0

      - run: npm ci

      - run: npm test

      - run: npm run typecheck

      - name: Generate validation config
        run: sed "s/YOUR_D1_DATABASE_ID/00000000-0000-0000-0000-000000000001/" wrangler.example.toml > wrangler.toml

      - run: npm run dry-run

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm install --global npm@11.6.0

      - run: npm ci

      - name: Generate Wrangler config
        run: |
          if [ -z "$CLOUDFLARE_D1_DATABASE_ID" ]; then
            echo "::error::Missing GitHub secret CLOUDFLARE_D1_DATABASE_ID"
            exit 1
          fi
          sed "s/YOUR_D1_DATABASE_ID/${CLOUDFLARE_D1_DATABASE_ID}/" wrangler.example.toml > wrangler.toml
        env:
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}

      - run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
