name: CI and Deploy

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/comprehensive-hardening

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Align Wrangler 4 Node requirement docs
        run: |
          sed -i 's/Node.js 20 or newer/Node.js 22 or newer/' README.md
          sed -i 's/Node.js 20 或更新版本/Node.js 22 或更新版本/' README.zh-CN.md
          if git diff --quiet -- README.md README.zh-CN.md; then
            echo "README Node requirements already in sync"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md README.zh-CN.md
            git commit -m "docs: require Node 22 for Wrangler 4"
            git push origin HEAD:codex/comprehensive-hardening
          fi

      # npm 10.9.8 crashes in Arborist while resolving Vitest 4.1.x peers.
      - run: npm install --global npm@11.6.0

      - run: npm ci

      - run: npm test

      - run: npm run typecheck

      - name: Generate validation config
        run: sed "s/YOUR_D1_DATABASE_ID/00000000-0000-0000-0000-000000000001/" wrangler.example.toml > wrangler.toml

      - run: npm run dry-run

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm install --global npm@11.6.0

      - run: npm ci

      - name: Generate Wrangler config
        run: |
          if [ -z "$CLOUDFLARE_D1_DATABASE_ID" ]; then
            echo "::error::Missing GitHub secret CLOUDFLARE_D1_DATABASE_ID"
            exit 1
          fi
          sed "s/YOUR_D1_DATABASE_ID/${CLOUDFLARE_D1_DATABASE_ID}/" wrangler.example.toml > wrangler.toml
        env:
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}

      - run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
