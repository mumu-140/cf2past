name: Sync lockfile

on:
  push:
    branches:
      - codex/comprehensive-hardening
    paths:
      - .github/workflows/lockfile-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/comprehensive-hardening

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm install --global npm@11.6.0

      - name: Regenerate package lock
        run: npm install --package-lock-only

      - name: Commit package lock
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already in sync"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: sync package lock"
          git push origin HEAD:codex/comprehensive-hardening
